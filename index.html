<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배관 영업 GIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header id="sidebar-header">
        <h1>배관 영업 GIS</h1>
        <p>수요처 · 지적/도시계획 · 배관 작도</p>
      </header>

      <!-- 모드 전환 (항상 표시) -->
      <section class="panel mode-panel">
        <div class="seg" id="mode-switch">
          <button data-mode="sales" class="active">영업</button>
          <button data-mode="excavation">굴착심의</button>
          <button data-mode="network">배관망</button>
        </div>
        <div class="seg sm" id="colorby-switch">
          <button data-colorby="diameter" class="active">관경색</button>
          <button data-colorby="pavement">포장색</button>
        </div>
        <div id="mode-legend"></div>
        <button id="mode-collapse" class="mode-collapse" title="모드 탭 접기">▴</button>
      </section>

      <!-- 탭 -->
      <nav id="tabs">
        <button data-tab="demands" class="active">수요처</button>
        <button data-tab="pipes">배관</button>
        <button data-tab="layers">디자인</button>
        <button data-tab="io">저장</button>
      </nav>

      <div id="tab-body">
        <!-- 수요처 탭 -->
        <div class="tab-pane" data-tab="demands">
          <section class="panel">
            <div class="panel-label">수요처 검색</div>
            <textarea id="search-input" rows="3"
              placeholder="한 줄에 하나씩 주소/장소 입력&#10;예) 서울특별시 종로구 세종대로 172"></textarea>
            <div class="row">
              <button id="search-btn" class="btn-primary">검색</button>
              <button id="search-clear" class="btn-ghost">지우기</button>
            </div>
            <label class="check-row">
              <input type="checkbox" id="filter-memo" /> 메모 있는 수요처만
            </label>
          </section>

          <section class="panel grow">
            <div class="panel-label di-list-head">
              <span>수요처 <span id="demand-count">0</span></span>
              <span class="di-sort-wrap">
                <select id="demand-sort" class="di-sort" title="정렬 기준">
                  <option value="num">순번</option>
                  <option value="address">주소</option>
                  <option value="meters">계량기 수</option>
                  <option value="memo">메모</option>
                </select>
                <button id="demand-sort-dir" class="di-sort-dir" title="오름/내림차순">▲</button>
              </span>
            </div>
            <ul id="demand-list"></ul>
          </section>
        </div>

        <!-- 배관 탭 -->
        <div class="tab-pane hidden" data-tab="pipes">
          <section class="panel">
            <div class="panel-label di-list-head">
              <span>배관 연장 집계</span>
              <span class="di-sort-wrap">
                <select id="pt-sort" class="di-sort" title="정렬 기준">
                  <option value="len">연장</option>
                  <option value="name">이름</option>
                </select>
                <button id="pt-sort-dir" class="di-sort-dir" title="오름/내림차순">▼</button>
              </span>
            </div>
            <ul id="pipe-totals"></ul>
            <div id="pipe-total-sum"></div>
            <button id="meter-toggle" class="meter-toggle" aria-expanded="false">▸ 구간별 계량기 정보 보기</button>
            <div id="meter-agg" class="meter-agg hidden"></div>
          </section>

          <section class="panel">
            <div class="panel-label">도로 따라 자동 연결</div>
            <div class="ar-src">
              <label class="check-row" style="margin:0"><input type="checkbox" id="ar-supply" checked /> 공급관</label>
              <label class="check-row" style="margin:0"><input type="checkbox" id="ar-inlet" checked /> 인입관</label>
            </div>
            <button id="ar-run" class="btn-primary" style="width:100%;margin-top:8px">수요처 자동 연결</button>
            <div id="ar-status" class="hint-text">공급관은 도로를 따라(기존관에서 출발), 인입관은 공급관에서 각 수요처 필지 경계까지 연결합니다. Ctrl+Z로 한 번에 되돌립니다.</div>
          </section>
        </div>

        <!-- 디자인 탭 (마커 스타일 + 레이어) -->
        <div class="tab-pane hidden" data-tab="layers">
          <section class="panel">
            <div class="panel-label">마커 스타일 (전체)</div>
            <div class="ms-cap">채움색</div>
            <div class="di-colors" id="ms-colors"></div>
            <div class="ms-cap">테두리색</div>
            <div class="di-colors" id="ms-border-color"></div>
            <div class="ms-grid">
              <div class="ms-field">
                <span class="ms-lab">모양</span>
                <div class="di-shapes" id="ms-shapes"></div>
              </div>
              <div class="ms-field">
                <span class="ms-lab">테두리</span>
                <div class="seg sm" id="ms-border">
                  <button data-border="solid">실선</button>
                  <button data-border="dashed">점선</button>
                </div>
              </div>
              <div class="ms-field">
                <span class="ms-lab">숫자</span>
                <div class="seg sm" id="ms-num">
                  <button data-num="show">표시</button>
                  <button data-num="hide">숨김</button>
                </div>
              </div>
            </div>
            <div class="ms-cap">크기</div>
            <input type="range" id="ms-size" class="ms-size" min="6" max="20" step="1" value="10" />
          </section>

          <section class="panel">
            <div class="panel-label">레이어</div>
            <div class="layer-row">
              <label class="switch-row">
                <input type="checkbox" id="poss-toggle" /> 소유구분지적도
              </label>
              <input type="range" id="poss-opacity" min="10" max="100" value="75" />
            </div>
            <div class="layer-row">
              <label class="switch-row">
                <input type="checkbox" id="road-toggle" /> 도시계획도로
              </label>
              <input type="range" id="road-opacity" min="10" max="100" value="80" />
            </div>
          </section>
        </div>

        <!-- 저장 탭 -->
        <div class="tab-pane hidden" data-tab="io">
          <section class="panel">
            <!-- 탐색기: 경로 + 폴더/파일 목록 + 저장 -->
            <div class="sv-head">
              <span id="sv-path" class="sv-path"></span>
              <span class="sv-head-btns">
                <button id="folder-new" class="sv-mini" title="새 폴더 만들기">+ 폴더</button>
                <button id="folder-del" class="sv-mini" title="현재 폴더 삭제">폴더삭제</button>
                <button id="gh-list-btn" class="sv-mini" title="목록 새로고침">새로고침</button>
              </span>
            </div>
            <ul id="gh-list" class="sv-list"></ul>
            <div class="row sv-save">
              <input type="text" id="save-name" placeholder="파일 이름" />
              <button id="save-btn" class="btn-primary">저장</button>
            </div>
            <div id="save-status"></div>
          </section>

          <section class="panel">
            <div class="panel-label">로컬 파일</div>
            <div class="row">
              <button id="export-btn" class="btn-ghost">내보내기</button>
              <button id="import-btn" class="btn-ghost">파일 열기</button>
            </div>
            <input type="file" id="import-file" accept="application/json" class="hidden" />
          </section>

          <section class="panel">
            <div class="panel-label">사진 저장</div>
            <label class="check-row" style="margin:0 0 6px"><input type="checkbox" id="export-legend" checked /> 범례 포함</label>
            <button id="export-img-btn" class="btn-ghost" style="width:100%">사진 저장</button>
            <div id="export-img-status" class="hint-text"></div>
          </section>
        </div>
      </div>

      <footer id="env-note"></footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>

      <!-- 배관 도구 툴바 -->
      <div id="pipe-tools">
        <button data-tool="select" title="선택 (V)">선택</button>
        <button data-tool="draw" title="작도 (P)">작도</button>
        <button data-tool="vertex" title="꼭짓점 편집 (A)">꼭짓점</button>
        <span class="tb-sep"></span>
        <button id="tb-undo" title="실행취소 (Ctrl+Z)">↶</button>
        <button id="tb-redo" title="다시실행 (Ctrl+Y)">↷</button>
      </div>
      <div id="pipe-hint"></div>

      <!-- 배관 범례 (현재 종류) -->
      <div id="pipe-legend" class="hidden">
        <div class="lg-head"><span>범례</span><button id="legend-toggle" title="범례 접기/펴기">▾</button></div>
        <ul id="legend-list"></ul>
      </div>

      <div id="basemap-switch">
        <button data-base="Base" class="active">기본</button>
        <button data-base="Satellite">위성</button>
      </div>

      <!-- 배관 속성 패널 -->
      <div id="pipe-attr" class="hidden">
        <div class="pa-head">
          <strong id="pa-title">배관 속성</strong>
          <span id="pa-len" class="pa-len"></span>
          <button id="pa-close" class="pa-close">✕</button>
        </div>
        <div class="pa-grid">
          <label>재질
            <select id="pa-material">
              <option value="PLP">PLP(강관)</option>
              <option value="PE">PE</option>
            </select>
          </label>
          <label>관경
            <select id="pa-diameter"></select>
          </label>
          <label>용도
            <select id="pa-use">
              <option value="supply">공급관</option>
              <option value="inlet">인입관</option>
            </select>
          </label>
          <label>압력
            <select id="pa-pressure">
              <option value="중압">중압</option>
              <option value="저압">저압</option>
            </select>
          </label>
          <label id="pa-status-wrap">상태
            <select id="pa-status">
              <option value="planned">설치예정</option>
              <option value="existing">기존관</option>
            </select>
          </label>
          <label id="pa-marker-wrap" class="hidden">마커번호
            <input id="pa-markerNo" type="number" min="1" step="1" placeholder="수요처 #" />
          </label>
          <label id="pa-review-wrap">심의
            <select id="pa-review">
              <option value="none">비대상</option>
              <option value="target">굴착심의 대상</option>
            </select>
          </label>
          <label>포장
            <select id="pa-pavement">
              <option value="none">없음</option>
              <option value="asphalt">아스팔트</option>
              <option value="concrete">콘크리트</option>
              <option value="block">보도블럭</option>
            </select>
          </label>
          <label id="pa-section-wrap">구간 번호
            <input id="pa-section" type="number" min="1" step="1" />
          </label>
        </div>
        <div class="pa-actions">
          <button id="pa-del" class="btn-del">이 배관 삭제</button>
        </div>
      </div>

      <div id="parcel-popup" class="hidden"></div>
      <div id="marker-popup" class="hidden"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
