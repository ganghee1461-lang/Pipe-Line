<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배관 영업 GIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header id="sidebar-header">
        <h1>배관 영업 GIS</h1>
        <p>수요처 · 지적/도시계획 · 배관 작도</p>
      </header>

      <!-- 모드 전환 (항상 표시) -->
      <section class="panel mode-panel">
        <div class="seg" id="mode-switch">
          <button data-mode="sales" class="active">영업</button>
          <button data-mode="excavation">굴착심의</button>
          <button data-mode="network">배관망</button>
        </div>
        <div id="mode-legend"></div>
      </section>

      <!-- 탭 -->
      <nav id="tabs">
        <button data-tab="demands" class="active">수요처</button>
        <button data-tab="pipes">배관</button>
        <button data-tab="layers">레이어</button>
        <button data-tab="io">저장</button>
      </nav>

      <div id="tab-body">
        <!-- 수요처 탭 -->
        <div class="tab-pane" data-tab="demands">
          <section class="panel">
            <div class="panel-label">수요처 검색</div>
            <textarea id="search-input" rows="3"
              placeholder="한 줄에 하나씩 주소/장소 입력&#10;예) 서울특별시 종로구 세종대로 172"></textarea>
            <div class="row">
              <button id="search-btn" class="btn-primary">검색</button>
              <button id="search-clear" class="btn-ghost">지우기</button>
            </div>
            <label class="check-row">
              <input type="checkbox" id="filter-memo" /> 메모 있는 수요처만
            </label>
          </section>

          <section class="panel">
            <div class="panel-label">마커 스타일 (전체)</div>
            <div class="di-colors" id="ms-colors"></div>
            <div class="di-shapes" id="ms-shapes"></div>
          </section>

          <section class="panel grow">
            <div class="panel-label">수요처 <span id="demand-count">0</span></div>
            <ul id="demand-list"></ul>
          </section>
        </div>

        <!-- 배관 탭 -->
        <div class="tab-pane hidden" data-tab="pipes">
          <section class="panel">
            <div class="panel-label">배관 연장 집계</div>
            <ul id="pipe-totals"></ul>
            <div id="pipe-total-sum"></div>
          </section>
        </div>

        <!-- 레이어 탭 -->
        <div class="tab-pane hidden" data-tab="layers">
          <section class="panel">
            <div class="panel-label">레이어</div>
            <div class="layer-row">
              <label class="switch-row">
                <input type="checkbox" id="poss-toggle" /> 소유구분지적도
              </label>
              <input type="range" id="poss-opacity" min="10" max="100" value="75" />
            </div>
            <div class="layer-row">
              <label class="switch-row">
                <input type="checkbox" id="road-toggle" /> 도시계획도로
              </label>
              <input type="range" id="road-opacity" min="10" max="100" value="80" />
            </div>
          </section>
        </div>

        <!-- 저장 탭 -->
        <div class="tab-pane hidden" data-tab="io">
          <section class="panel">
            <div class="panel-label">저장 / 불러오기</div>
            <div class="row">
              <input type="text" id="save-name" placeholder="파일 이름" />
              <button id="save-btn" class="btn-primary">저장</button>
            </div>
            <ul id="save-list"></ul>
            <div class="row">
              <button id="export-btn" class="btn-ghost">내보내기</button>
              <button id="import-btn" class="btn-ghost">파일 열기</button>
            </div>
            <input type="file" id="import-file" accept="application/json" class="hidden" />
          </section>

          <section class="panel">
            <div class="panel-label">GitHub save/ 폴더</div>
            <button id="gh-list-btn" class="btn-ghost" style="width:100%">목록 불러오기</button>
            <ul id="gh-list"></ul>
          </section>
        </div>
      </div>

      <footer id="env-note"></footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>

      <!-- 배관 도구 툴바 -->
      <div id="pipe-tools">
        <button data-tool="select" title="선택 (V)">선택</button>
        <button data-tool="draw" title="작도 (P)">작도</button>
        <button data-tool="vertex" title="꼭짓점 편집 (A)">꼭짓점</button>
        <span class="tb-sep"></span>
        <button id="tb-undo" title="실행취소 (Ctrl+Z)">↶</button>
        <button id="tb-redo" title="다시실행 (Ctrl+Y)">↷</button>
      </div>
      <div id="pipe-hint"></div>

      <!-- 배관 범례 (현재 종류) -->
      <div id="pipe-legend" class="hidden">
        <div class="lg-head"><span>범례</span><button id="legend-toggle" title="범례 접기/펴기">▾</button></div>
        <ul id="legend-list"></ul>
      </div>

      <div id="basemap-switch">
        <button data-base="Base" class="active">기본</button>
        <button data-base="Satellite">위성</button>
      </div>

      <!-- 배관 속성 패널 -->
      <div id="pipe-attr" class="hidden">
        <div class="pa-head">
          <strong id="pa-title">배관 속성</strong>
          <span id="pa-len" class="pa-len"></span>
          <button id="pa-close" class="pa-close">✕</button>
        </div>
        <div class="pa-grid">
          <label>재질
            <select id="pa-material">
              <option value="PLP">PLP(강관)</option>
              <option value="PE">PE</option>
            </select>
          </label>
          <label>관경
            <select id="pa-diameter"></select>
          </label>
          <label>용도
            <select id="pa-use">
              <option value="supply">공급관</option>
              <option value="inlet">인입관</option>
            </select>
          </label>
          <label>압력
            <select id="pa-pressure">
              <option value="중압">중압</option>
              <option value="저압">저압</option>
            </select>
          </label>
          <label>상태
            <select id="pa-status">
              <option value="planned">설치예정</option>
              <option value="existing">기존관</option>
            </select>
          </label>
          <label>심의
            <select id="pa-review">
              <option value="none">비대상</option>
              <option value="target">굴착심의 대상</option>
            </select>
          </label>
          <label>포장
            <select id="pa-pavement">
              <option value="none">없음</option>
              <option value="asphalt">아스팔트</option>
              <option value="concrete">콘크리트</option>
              <option value="block">보도블럭</option>
            </select>
          </label>
        </div>
        <div class="pa-actions">
          <button id="pa-del" class="btn-del">이 배관 삭제</button>
        </div>
      </div>

      <div id="parcel-popup" class="hidden"></div>
      <div id="marker-popup" class="hidden"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
